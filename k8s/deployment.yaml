apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-b-deployment
  labels:
    app: api-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-b
  template:
    metadata:
      labels:
        app: api-b
    spec:
      containers:
        - name: api-b
          image: us-central1-docker.pkg.dev/motorcycle-workshop-v2/api-b-images/api-b:v2.0.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: api-b-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"