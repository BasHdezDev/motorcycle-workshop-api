services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motorcycle-workshop-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://workshop_user:workshop_password@postgres:5432/motorcycle_workshop
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    container_name: motorcycle-workshop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: