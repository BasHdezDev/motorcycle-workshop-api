name: Testing Pipeline

on:
  push:
    branches-ignore:
      - main

jobs:
  build-and-test:
    name: Build, Test & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Enforce coverage threshold (60%)
        run: |
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below the 60% threshold required for Testing"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets the threshold"

  deploy:
    name: Deploy to Railway (Testing)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service motorcycle-workshop-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_TESTING }}