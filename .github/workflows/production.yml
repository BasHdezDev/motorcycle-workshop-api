name: Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test & Coverage Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Enforce coverage threshold (91%)
        run: |
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 91" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below the 91% threshold required for Production"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets the threshold"

  deploy:
    name: Deploy to Railway (Production)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service motorcycle-workshop-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Wait for deployment to be healthy
        run: |
          echo "Waiting for the app to boot..."
          sleep 20
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://motorcycle-workshop-api-production.up.railway.app/health)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after multiple attempts"
          exit 1    