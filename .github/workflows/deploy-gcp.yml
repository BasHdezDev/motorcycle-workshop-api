name: Deploy to Google Cloud

on:
  # Temporary: lets us test the pipeline from the V3 branch before merging.
  # A workflow_dispatch trigger only shows up once the file is on the default branch.
  push:
    branches:
      - v3-terraform-gcp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
